; 模型类型使用 rf 或 mask_rcnn。model_path 由使用者手动指定，不会随模型类型自动切换。
[cnn]
model_type=rf
model_path=models/rfdetr.onnx
input_width=560
input_height=560
score_threshold=0.65
mask_threshold=0.5
mask_output=logits
score_activation=sigmoid
exclude_last_class=false
clip_masks_to_boxes=false

[camera]
capture_retry_timeout_ms=10000
